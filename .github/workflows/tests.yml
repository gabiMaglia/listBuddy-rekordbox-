# Suite de tests en macOS (T-097) + subconjunto sin GUI de Qt en Windows (T-108, TEC-29).
# La suite completa solo corre en macOS: los tests de Qt arrancan ventanas reales en
# intérpretes aparte (tests/_qt_isolated.py) y miran fuentes, contraste y SIGSEGV del proceso;
# no están validados en Linux (offscreen pasa en macOS, pero sin evidencia en ubuntu).
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (macOS, Python 3.14.8)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # T-099 F0: los trinquetes se comparan contra el merge-base con main

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Barandas T-099 (fuera de pytest; ningún test las puede tocar)
        run: python -I scripts/t099_guard_check.py

      - name: Codemod T-099 contra la base (ADR-007 D5, solo ramas feat/t099-*)
        if: startsWith(github.head_ref, 'feat/t099-')
        run: python -I scripts/t099_guard_check.py --with-check

      - name: Tests
        run: python -m pytest -q

  # Windows (TEC-29): sanitize, resolve_path, _safe_filename, os.replace, locks, scripts estáticos. Los tests que abren
  # GUI de Qt (marcador `qt`) y los que dependen de bash/shasum/permisos POSIX (`posix`) se saltean (tests/conftest.py).
  # LISTBUDDY_NO_QT=1: si un test qt quedara mal clasificado, run_isolated falla en vez de abrir una ventana.
  windows:
    name: pytest sin Qt real (Windows, Python 3.14.8)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      LISTBUDDY_NO_QT: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # T-099 F0: los trinquetes se comparan contra el merge-base con main

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.8'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Barandas T-099 (fuera de pytest; ningún test las puede tocar)
        run: python -I scripts/t099_guard_check.py

      - name: Codemod T-099 contra la base (ADR-007 D5, solo ramas feat/t099-*)
        if: startsWith(github.head_ref, 'feat/t099-')
        run: python -I scripts/t099_guard_check.py --with-check

      - name: Tests
        run: python -m pytest -q -m "not qt and not posix"
