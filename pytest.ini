[pytest]
# Tests de correctitud de las piezas que ESCRIBEN sobre la librería del usuario
# (encoder/decoder de rutas, matching, backup, escritura atómica, sync). No
# cubren la UI (Qt) ni la DB real de Rekordbox/Traktor — ver D-04.
testpaths = tests
addopts = -q -n 4 -m "not slow"
markers =
    slow: depende de la máquina; solo con `-m slow` (T-106)
    release_gate: gate de publicación; solo corre con LISTBUDDY_RELEASE_GATE=1
